name: primegym
description: "PrimeGym — localized fitness UI demo for Ethiopia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  youtube_player_iframe: ^6.0.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/exercise/
    - assets/images/onbaording/
    - assets/images/target-muscles/
    - assets/icons/
    - assets/bg/
    - assets/illustrations/abs/
    - assets/illustrations/back/
    - assets/illustrations/biceps/
    - assets/illustrations/calf/
    - assets/illustrations/chest/
    - assets/illustrations/glute/
    - assets/illustrations/legs/
    - assets/illustrations/neck/
    - assets/illustrations/shoulder/
    - assets/illustrations/triceps/
