name: primegym
description: "PrimeGym — localized fitness UI demo for Ethiopia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  youtube_player_iframe: ^6.0.2
  video_player: ^2.14.0
  dio: ^5.11.1
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  share_plus: ^12.0.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/exercise/
    - assets/images/onbaording/
    - assets/images/share/
    - assets/images/target-muscles/
    - assets/icons/
    - assets/bg/
